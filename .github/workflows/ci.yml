name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  integrity:
    name: Integrity / Scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Verify repository integrity guardrails
        run: |
          set -euo pipefail

          tracked_env="$(
            git ls-files |
            grep -E '(^|/)\.env($|\.)' || true
          )"

          if [[ -n "$tracked_env" ]]; then
            printf '%s\n' "$tracked_env" >&2
            echo "Tracked .env-style file detected." >&2
            exit 1
          fi

          if [[ -e database/database.sqlite ]]; then
            echo "SQLite database artifact is not allowed in the V3 CI baseline." >&2
            exit 1
          fi

          grep -Fq \
            "'default' => env('DB_CONNECTION', 'pgsql')" \
            config/database.php

          grep -Fq \
            '<env name="DB_CONNECTION" value="pgsql"/>' \
            phpunit.xml

          echo "Repository integrity guardrails: PASS"

  backend:
    name: Backend / PostgreSQL
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_MAINTENANCE_DRIVER: file
      CACHE_STORE: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: pbr_ci
      DB_USERNAME: pbr_ci
      DB_PASSWORD: pbr_ci_password
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6382"
      REDIS_USERNAME: thepbr_os_v3_test_app
      REDIS_DB: "0"
      REDIS_CACHE_DB: "1"
      REDIS_PREFIX: "thepbr-os-v3:test:"
      SESSION_DRIVER: redis
      SESSION_STORE: redis
      SESSION_CONNECTION: default
      SESSION_PREFIX: "sessions:"
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "false"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      PBR_DOCUMENTS_S3_KEY: pbrcidocs
      PBR_DOCUMENTS_S3_BUCKET: thepbr-os-v3-ci-documents
      PBR_DOCUMENTS_S3_ENDPOINT: http://127.0.0.1:9010
      PBR_DOCUMENTS_S3_REGION: us-east-1
      PBR_DOCUMENTS_S3_PATH_STYLE: "true"
      PBR_DOCUMENTS_S3_INTEGRATION: "true"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pbr_ci
          POSTGRES_USER: pbr_ci
          POSTGRES_PASSWORD: pbr_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbr_ci -d pbr_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis
          coverage: none
          tools: composer:2.7.1
          github-token: ""

      - name: Verify PHP and Composer runtime
        run: |
          set -euo pipefail

          php -r '
          if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 4) {
              fwrite(STDERR, "Expected PHP 8.4.\n");
              exit(1);
          }

          echo "PHP ", PHP_VERSION, PHP_EOL;
          '

          composer --version

      - name: Create ephemeral Laravel test environment file
        run: |
          set -euo pipefail

          : > .env
          chmod 600 .env

          test -f .env
          test ! -s .env

          echo "Ephemeral Laravel test environment file: PASS"

      - name: Validate Composer metadata
        run: |
          set -euo pipefail
          composer validate --strict --no-interaction --no-check-publish

      - name: Audit locked Composer dependencies
        run: |
          set -euo pipefail
          composer audit --locked --no-interaction --no-ansi

      - name: Install Composer dependencies from lock
        run: |
          set -euo pipefail

          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --no-ansi

          composer check-platform-reqs

      - name: Start isolated MinIO document integration service
        run: |
          set -Eeuo pipefail

          work="/tmp/thepbr-os-v3-minio-ci"
          minio_src="$work/minio-src"
          minio_bin="$work/minio"
          minio_data="$work/data"
          minio_log="$work/minio.log"

          go_root="$work/go"
          go_tar="$work/go1.24.8.linux-amd64.tar.gz"

          mc_bin="$work/mc"
          mc_sum="$work/mc.sha256sum"
          policy_file="$work/policy.json"

          minio_release="RELEASE.2025-10-15T17-29-55Z"
          minio_commit="9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a"

          go_sha="6842c516ca66c89d648a7f1dbe28e28c47b61b59f8f06633eb2ceb1188e9251d"

          mc_release="RELEASE.2025-08-13T08-35-41Z"
          mc_sha="01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891"
          mc_sum_sha="721575d09254b86e9d10e04c936165b7df00384da18ca44399386352da964a4c"

          root_user="pbrciroot"
          app_user="$PBR_DOCUMENTS_S3_KEY"
          bucket="$PBR_DOCUMENTS_S3_BUCKET"
          policy_name="thepbr-os-v3-ci-documents-app"

          rm -rf "$work"
          mkdir -p "$work" "$minio_data"

          root_secret="$(openssl rand -hex 32)"
          app_secret="$(openssl rand -hex 32)"

          if [[ -z "$root_secret" || -z "$app_secret" ]]; then
            echo "Failed to generate disposable MinIO credentials." >&2
            exit 1
          fi

          echo "::add-mask::$root_secret"
          echo "::add-mask::$app_secret"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --output "$go_tar" \
            https://go.dev/dl/go1.24.8.linux-amd64.tar.gz

          printf '%s  %s\n' "$go_sha" "$go_tar" |
            sha256sum --check --strict -

          mkdir -p "$go_root"

          tar \
            --extract \
            --gzip \
            --file "$go_tar" \
            --directory "$go_root" \
            --strip-components=1

          export GOROOT="$go_root"
          export GOPATH="$work/gopath"
          export GOCACHE="$work/gocache"
          export GOMODCACHE="$work/gomodcache"
          export PATH="$GOROOT/bin:$PATH"

          go version |
            grep -Fx 'go version go1.24.8 linux/amd64'

          git init -q "$minio_src"

          git -C "$minio_src" remote add \
            origin \
            https://github.com/minio/minio.git

          git -C "$minio_src" fetch \
            --quiet \
            --depth=1 \
            origin \
            "refs/tags/${minio_release}:refs/tags/${minio_release}"

          git -C "$minio_src" checkout \
            --quiet \
            --detach \
            "refs/tags/${minio_release}"

          actual_commit="$(
            git -C "$minio_src" rev-parse HEAD
          )"

          if [[ "$actual_commit" != "$minio_commit" ]]; then
            echo "MinIO source commit mismatch." >&2
            exit 1
          fi

          cd "$minio_src"

          ldflags="$(
            MINIO_RELEASE=RELEASE \
              go run buildscripts/gen-ldflags.go
          )"

          MINIO_RELEASE=RELEASE \
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=amd64 \
            go build \
              -tags kqueue \
              -trimpath \
              --ldflags "$ldflags" \
              -o "$minio_bin"

          minio_version="$("$minio_bin" --version)"

          printf '%s\n' "$minio_version"

          printf '%s\n' "$minio_version" |
            grep -Fq "$minio_release"

          printf '%s\n' "$minio_version" |
            grep -Fq "$minio_commit"

          printf '%s\n' "$minio_version" |
            grep -Fq 'go1.24.8 linux/amd64'

          cd "$GITHUB_WORKSPACE"

          "$GOROOT/bin/go" clean -modcache

          rm -rf \
            "$minio_src" \
            "$go_root" \
            "$go_tar" \
            "$GOPATH" \
            "$GOCACHE"

          nohup env \
            MINIO_ROOT_USER="$root_user" \
            MINIO_ROOT_PASSWORD="$root_secret" \
            "$minio_bin" \
              server \
              "$minio_data" \
              --address 127.0.0.1:9010 \
              --console-address 127.0.0.1:9011 \
              >"$minio_log" 2>&1 &

          minio_pid=$!

          printf 'MINIO_CI_PID=%s\n' "$minio_pid" >> "$GITHUB_ENV"

          ready=0

          for attempt in $(seq 1 60); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 2 \
              http://127.0.0.1:9010/minio/health/ready \
              >/dev/null 2>&1
            then
              ready=1
              break
            fi

            sleep 1
          done

          if [[ "$ready" != "1" ]]; then
            echo "MinIO CI service did not become ready." >&2
            cat "$minio_log" || true
            exit 1
          fi

          if ! kill -0 "$minio_pid" 2>/dev/null; then
            echo "MinIO CI service exited unexpectedly." >&2
            cat "$minio_log" || true
            exit 1
          fi

          listener_lines="$(
            ss -H -ltnp 2>/dev/null |
              grep -F "pid=${minio_pid}," || true
          )"

          if [[ -z "$listener_lines" ]]; then
            echo "MinIO CI listener inventory is empty." >&2
            exit 1
          fi

          printf '%s\n' "$listener_lines"

          while IFS= read -r line; do
            [[ -n "$line" ]] || continue

            addr="$(
              printf '%s\n' "$line" |
                awk '{print $4}'
            )"

            case "$addr" in
              127.0.0.1:9010|127.0.0.1:9011|"[::1]:9010"|"[::1]:9011")
                ;;
              *)
                echo "Forbidden MinIO CI listener: $addr" >&2
                exit 1
                ;;
            esac
          done <<< "$listener_lines"

          printf '%s\n' "$listener_lines" |
            awk '$4 == "127.0.0.1:9010" { found=1 } END { exit(found ? 0 : 1) }'

          printf '%s\n' "$listener_lines" |
            awk '$4 == "127.0.0.1:9011" { found=1 } END { exit(found ? 0 : 1) }'

          mc_asset="mc.linux-amd64.${mc_release}"
          mc_sum_asset="${mc_asset}.sha256sum"
          mc_base="https://github.com/minio/mc/releases/download/${mc_release}"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --output "$mc_bin" \
            "${mc_base}/${mc_asset}"

          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 3 \
            --output "$mc_sum" \
            "${mc_base}/${mc_sum_asset}"

          printf '%s  %s\n' "$mc_sha" "$mc_bin" |
            sha256sum --check --strict -

          printf '%s  %s\n' "$mc_sum_sha" "$mc_sum" |
            sha256sum --check --strict -

          reported_mc_sha="$(
            awk 'NR == 1 { print $1 }' "$mc_sum"
          )"

          if [[ "$reported_mc_sha" != "$mc_sha" ]]; then
            echo "Official mc checksum mismatch." >&2
            exit 1
          fi

          chmod 0700 "$mc_bin"

          export MC_CONFIG_DIR="$work/mc-config"
          export MC_NO_COLOR=1
          export MC_DISABLE_PAGER=1

          mkdir -p "$MC_CONFIG_DIR"
          chmod 0700 "$MC_CONFIG_DIR"

          export MC_HOST_ciroot="http://${root_user}:${root_secret}@127.0.0.1:9010"

          "$mc_bin" admin info ciroot >/dev/null

          existing_buckets="$("$mc_bin" ls ciroot)"

          if [[ -n "$(printf '%s' "$existing_buckets" | tr -d '[:space:]')" ]]; then
            echo "Fresh CI MinIO unexpectedly contains buckets." >&2
            exit 1
          fi

          "$mc_bin" mb "ciroot/${bucket}"

          cat > "$policy_file" <<POLICY
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "s3:GetBucketLocation",
                  "s3:ListBucket",
                  "s3:ListBucketMultipartUploads"
                ],
                "Resource": [
                  "arn:aws:s3:::${bucket}"
                ]
              },
              {
                "Effect": "Allow",
                "Action": [
                  "s3:GetObject",
                  "s3:PutObject",
                  "s3:DeleteObject",
                  "s3:AbortMultipartUpload",
                  "s3:ListMultipartUploadParts"
                ],
                "Resource": [
                  "arn:aws:s3:::${bucket}/*"
                ]
              }
            ]
          }
          POLICY

          "$mc_bin" admin policy create \
            ciroot \
            "$policy_name" \
            "$policy_file"

          "$mc_bin" admin user add \
            ciroot \
            "$app_user" \
            "$app_secret"

          "$mc_bin" admin policy attach \
            ciroot \
            "$policy_name" \
            --user "$app_user"

          app_info="$(
            "$mc_bin" admin user info \
              ciroot \
              "$app_user"
          )"

          printf '%s\n' "$app_info"

          printf '%s\n' "$app_info" |
            grep -Fq "PolicyName: ${policy_name}"

          printf '%s\n' "$app_info" |
            grep -Fq 'Status: enabled'

          anonymous_policy="$(
            "$mc_bin" anonymous get \
              "ciroot/${bucket}"
          )"

          printf '%s\n' "$anonymous_policy" |
            grep -Fqi 'private'

          export MC_HOST_ciapp="http://${app_user}:${app_secret}@127.0.0.1:9010"

          "$mc_bin" ls "ciapp/${bucket}" >/dev/null

          set +e
          "$mc_bin" admin info ciapp >/dev/null 2>&1
          app_admin_rc=$?
          set -e

          if [[ "$app_admin_rc" -eq 0 ]]; then
            echo "CI application identity unexpectedly has admin access." >&2
            exit 1
          fi

          printf 'PBR_DOCUMENTS_S3_SECRET=%s\n' "$app_secret" >> "$GITHUB_ENV"

          unset MC_HOST_ciroot
          unset MC_HOST_ciapp
          unset root_secret
          unset app_secret

          rm -rf \
            "$mc_bin" \
            "$mc_sum" \
            "$MC_CONFIG_DIR" \
            "$policy_file"

          echo "Isolated MinIO document integration service: PASS"

      - name: Run PHP syntax audit
        run: |
          set -euo pipefail

          mapfile -d '' php_files < <(
            find app bootstrap config public routes tests \
              -type f \
              -name '*.php' \
              -print0
          )

          if (( ${#php_files[@]} == 0 )); then
            echo "No PHP source files found." >&2
            exit 1
          fi

          for file in "${php_files[@]}"; do
            php -l "$file" >/dev/null
          done

          printf 'PHP syntax audit: PASS (%d files)\n' "${#php_files[@]}"

      - name: Run Laravel Pint in test mode
        run: |
          set -euo pipefail
          vendor/bin/pint --test

      - name: Start isolated Redis session integration service
        run: |
          set -euo pipefail

          container="thepbr-os-v3-redis-ci"

          redis_password="$(
            openssl rand -hex 32
          )"

          if [[ -z "$redis_password" ]]; then
            echo "Failed to generate disposable CI Redis credential." >&2
            exit 1
          fi

          echo "::add-mask::$redis_password"

          docker run \
            --detach \
            --name "$container" \
            --publish 127.0.0.1:6382:6382 \
            redis:7.0.15-alpine \
            redis-server \
              --bind 0.0.0.0 \
              --protected-mode no \
              --port 6382 \
              --databases 2 \
              --save "" \
              --appendonly no \
              --maxmemory 128mb \
              --maxmemory-policy noeviction \
            >/dev/null

          ready=0

          for attempt in $(seq 1 30); do
            if docker exec "$container" \
              redis-cli -p 6382 --raw PING 2>/dev/null |
              grep -qx 'PONG'
            then
              ready=1
              break
            fi

            sleep 1
          done

          if [[ "$ready" != "1" ]]; then
            echo "Redis CI service did not become ready on 6382." >&2
            exit 1
          fi

          docker exec "$container" \
            redis-cli -p 6382 \
            ACL SETUSER "$REDIS_USERNAME" \
              on \
              ">$redis_password" \
              "~${REDIS_PREFIX}*" \
              +ping \
              +select \
              +get \
              +set \
              +setex \
              +psetex \
              +del \
              +unlink \
              +exists \
              +expire \
              +pexpire \
              +ttl \
              +pttl \
              +persist \
              +touch \
              +mget \
              +mset \
              +incr \
              +incrby \
              +decr \
              +decrby \
              +info \
            >/dev/null

          docker exec "$container" \
            redis-cli -p 6382 \
            ACL SETUSER default off \
            >/dev/null

          authenticated_ping="$(
            docker exec \
              -e REDISCLI_AUTH="$redis_password" \
              "$container" \
              redis-cli \
                --no-auth-warning \
                -p 6382 \
                --user "$REDIS_USERNAME" \
                --raw \
                PING
          )"

          if [[ "$authenticated_ping" != "PONG" ]]; then
            echo "Authenticated Redis CI PING failed." >&2
            exit 1
          fi

          unauthenticated_ping="$(
            docker exec "$container" \
              env -u REDISCLI_AUTH \
              redis-cli \
                --no-auth-warning \
                -p 6382 \
                --raw \
                PING 2>&1 || true
          )"

          if [[ "$unauthenticated_ping" != *"NOAUTH"* ]]; then
            echo "Unauthenticated Redis CI access was not denied." >&2
            exit 1
          fi

          printf 'REDIS_PASSWORD=%s\n' "$redis_password" >> "$GITHUB_ENV"

          unset redis_password

          echo "Isolated Redis session integration service: PASS"

      - name: Verify PostgreSQL integration service
        run: |
          set -euo pipefail

          php -r '
          $dsn = sprintf(
              "pgsql:host=%s;port=%s;dbname=%s",
              getenv("DB_HOST"),
              getenv("DB_PORT"),
              getenv("DB_DATABASE"),
          );

          $pdo = new PDO(
              $dsn,
              getenv("DB_USERNAME"),
              getenv("DB_PASSWORD"),
              [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION],
          );

          $result = $pdo->query("SELECT 1")->fetchColumn();

          if ((int) $result !== 1) {
              fwrite(STDERR, "PostgreSQL SELECT 1 failed.\n");
              exit(1);
          }

          echo "PostgreSQL SELECT 1: PASS\n";
          '

      - name: Run private S3 document integration test
        run: |
          set -euo pipefail

          test "$PBR_DOCUMENTS_S3_INTEGRATION" = "true"
          test -n "${PBR_DOCUMENTS_S3_SECRET:-}"

          php artisan test \
            tests/Feature/Documents/DocumentS3IntegrationTest.php \
            --colors=never

      - name: Run Laravel tests
        run: |
          set -euo pipefail
          composer test

      - name: Stop disposable MinIO document integration service
        if: always()
        run: |
          set -euo pipefail

          if [[ -n "${MINIO_CI_PID:-}" ]]; then
            kill "$MINIO_CI_PID" >/dev/null 2>&1 || true
            wait "$MINIO_CI_PID" >/dev/null 2>&1 || true
          fi

          work="/tmp/thepbr-os-v3-minio-ci"
          go_bin="$work/go/bin/go"
          gomodcache="$work/gomodcache"

          if [[ -x "$go_bin" && -d "$gomodcache" ]]; then
            GOROOT="$work/go" \
            GOPATH="$work/gopath" \
            GOCACHE="$work/gocache" \
            GOMODCACHE="$gomodcache" \
              "$go_bin" clean -modcache
          fi

          rm -rf "$work"

          echo "Disposable MinIO document integration cleanup: PASS"

  frontend:
    name: Frontend / Typecheck / Build
    needs: integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Verify Node.js runtime
        run: |
          set -euo pipefail

          node -e '
          const major = Number(process.versions.node.split(".")[0]);

          if (major !== 22) {
            console.error(
              `Expected Node.js 22, received ${process.versions.node}`
            );
            process.exit(1);
          }

          console.log(`Node.js ${process.versions.node}`);
          '

          npm --version

      - name: Audit locked npm dependencies
        run: |
          set -euo pipefail
          npm audit --package-lock-only --audit-level=high

      - name: Install npm dependencies from lock
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm ls --all

      - name: Run TypeScript typecheck
        run: |
          set -euo pipefail
          npm run typecheck

      - name: Run frontend production build
        run: |
          set -euo pipefail
          npm run build

          test -f public/build/manifest.json

          build_files="$(
            find public/build \
              -type f \
              -print |
            LC_ALL=C sort
          )"

          if [[ -z "$build_files" ]]; then
            echo "Frontend build produced no files." >&2
            exit 1
          fi

          printf '%s\n' "$build_files"
          echo "Frontend production build: PASS"

  e2e:
    name: E2E / Chromium
    needs:
      - integrity
      - backend
      - frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "false"
      APP_MAINTENANCE_DRIVER: file
      APP_URL: http://127.0.0.1:8000
      CACHE_STORE: array
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_DATABASE: pbr_ci
      DB_USERNAME: pbr_ci
      DB_PASSWORD: pbr_ci_password
      MAIL_MAILER: array
      QUEUE_CONNECTION: sync
      REDIS_CLIENT: phpredis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6382"
      REDIS_USERNAME: thepbr_os_v3_test_app
      REDIS_DB: "0"
      REDIS_CACHE_DB: "1"
      REDIS_PREFIX: "thepbr-os-v3:test:"
      SESSION_DRIVER: redis
      SESSION_STORE: redis
      SESSION_CONNECTION: default
      SESSION_PREFIX: "sessions:"
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "false"
      SESSION_HTTP_ONLY: "true"
      SESSION_SAME_SITE: lax
      E2E_BASE_URL: http://127.0.0.1:8000
      PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "180000"

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pbr_ci
          POSTGRES_USER: pbr_ci
          POSTGRES_PASSWORD: pbr_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbr_ci -d pbr_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          show-progress: false

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis
          coverage: none
          tools: composer:2.7.1
          github-token: ""

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.2"

      - name: Verify E2E runtimes
        run: |
          set -euo pipefail

          php -r '
          if (PHP_MAJOR_VERSION !== 8 || PHP_MINOR_VERSION !== 4) {
              fwrite(STDERR, "Expected PHP 8.4.\n");
              exit(1);
          }

          echo "PHP ", PHP_VERSION, PHP_EOL;
          '

          node -e '
          if (process.versions.node !== "22.23.2") {
            console.error(
              `Expected Node.js 22.23.2, received ${process.versions.node}`
            );
            process.exit(1);
          }

          console.log(`Node.js ${process.versions.node}`);
          '

          composer --version
          npm --version

      - name: Create ephemeral Laravel test environment file
        run: |
          set -euo pipefail

          : > .env
          chmod 600 .env

          test -f .env
          test ! -s .env

          echo "Ephemeral Laravel test environment file: PASS"

      - name: Install Composer dependencies from lock
        run: |
          set -euo pipefail

          composer validate --strict --no-interaction --no-check-publish

          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --no-ansi

          composer check-platform-reqs

      - name: Install npm dependencies from lock
        run: |
          set -euo pipefail

          npm ci --no-audit --no-fund
          npm ls --all

          node -e '
          const versions = {
            test: require("@playwright/test/package.json").version,
            playwright: require("playwright/package.json").version,
            core: require("playwright-core/package.json").version,
          };

          for (const [name, version] of Object.entries(versions)) {
            if (version !== "1.63.0") {
              console.error(
                `Expected Playwright 1.63.0 for ${name}, received ${version}`
              );
              process.exit(1);
            }
          }

          console.log("Playwright dependency identity: PASS");
          '

      - name: Build frontend assets for browser execution
        run: |
          set -euo pipefail

          npm run typecheck
          npm run build

          test -f public/build/manifest.json

          echo "E2E frontend assets: PASS"

      - name: Install Chromium browser runtime
        run: |
          set -euo pipefail

          npx playwright install --with-deps chromium

          npx playwright --version

          echo "Chromium browser runtime: PASS"

      - name: Start isolated Redis session integration service
        run: |
          set -euo pipefail

          container="thepbr-os-v3-redis-ci-e2e"

          redis_password="$(
            openssl rand -hex 32
          )"

          if [[ -z "$redis_password" ]]; then
            echo "Failed to generate disposable E2E Redis credential." >&2
            exit 1
          fi

          echo "::add-mask::$redis_password"

          docker run \
            --detach \
            --name "$container" \
            --publish 127.0.0.1:6382:6382 \
            redis:7.0.15-alpine \
            redis-server \
              --bind 0.0.0.0 \
              --protected-mode no \
              --port 6382 \
              --databases 2 \
              --save "" \
              --appendonly no \
              --maxmemory 128mb \
              --maxmemory-policy noeviction \
            >/dev/null

          ready=0

          for attempt in $(seq 1 30); do
            if docker exec "$container" \
              redis-cli -p 6382 --raw PING 2>/dev/null |
              grep -qx 'PONG'
            then
              ready=1
              break
            fi

            sleep 1
          done

          if [[ "$ready" != "1" ]]; then
            echo "Redis E2E service did not become ready on 6382." >&2
            exit 1
          fi

          docker exec "$container" \
            redis-cli -p 6382 \
            ACL SETUSER "$REDIS_USERNAME" \
              on \
              ">$redis_password" \
              "~${REDIS_PREFIX}*" \
              +ping \
              +select \
              +get \
              +set \
              +setex \
              +psetex \
              +del \
              +unlink \
              +exists \
              +expire \
              +pexpire \
              +ttl \
              +pttl \
              +persist \
              +touch \
              +mget \
              +mset \
              +incr \
              +incrby \
              +decr \
              +decrby \
              +info \
            >/dev/null

          docker exec "$container" \
            redis-cli -p 6382 \
            ACL SETUSER default off \
            >/dev/null

          authenticated_ping="$(
            docker exec \
              -e REDISCLI_AUTH="$redis_password" \
              "$container" \
              redis-cli \
                --no-auth-warning \
                -p 6382 \
                --user "$REDIS_USERNAME" \
                --raw \
                PING
          )"

          if [[ "$authenticated_ping" != "PONG" ]]; then
            echo "Authenticated Redis E2E PING failed." >&2
            exit 1
          fi

          unauthenticated_ping="$(
            docker exec "$container" \
              env -u REDISCLI_AUTH \
              redis-cli \
                --no-auth-warning \
                -p 6382 \
                --raw \
                PING 2>&1 || true
          )"

          if [[ "$unauthenticated_ping" != *"NOAUTH"* ]]; then
            echo "Unauthenticated Redis E2E access was not denied." >&2
            exit 1
          fi

          printf 'REDIS_PASSWORD=%s\n' "$redis_password" >> "$GITHUB_ENV"

          unset redis_password

          echo "Isolated Redis E2E service: PASS"

      - name: Run deterministic F1 browser journeys
        run: |
          set -Eeuo pipefail

          server_pid=""

          cleanup() {
            status=$?

            unset F1_E2E_PASSWORD || true

            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" >/dev/null 2>&1 || true
            fi

            if [[ "$status" -ne 0 && -f /tmp/f1-a13-e2e-server.log ]]; then
              echo "Laravel E2E server log:"
              tail -n 160 /tmp/f1-a13-e2e-server.log || true
            fi

            exit "$status"
          }

          trap cleanup EXIT

          e2e_password="PbrA13_$(openssl rand -hex 32)"

          if [[ -z "$e2e_password" ]]; then
            echo "Failed to generate disposable F1 E2E password." >&2
            exit 1
          fi

          echo "::add-mask::$e2e_password"

          export F1_E2E_PASSWORD="$e2e_password"

          php artisan migrate:fresh --force

          php tests/E2E/support/prepare-f1-e2e.php

          unset F1_E2E_PASSWORD

          php artisan serve \
            --host=127.0.0.1 \
            --port=8000 \
            >/tmp/f1-a13-e2e-server.log 2>&1 &

          server_pid=$!

          ready=0

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 2 \
              http://127.0.0.1:8000/login \
              >/dev/null
            then
              ready=1
              break
            fi

            sleep 1
          done

          if [[ "$ready" != "1" ]]; then
            echo "Laravel E2E server did not become ready." >&2
            exit 1
          fi

          export F1_E2E_PASSWORD="$e2e_password"

          npm run test:e2e -- \
            --project=chromium-desktop \
            tests/E2E/f1-boss-uat.spec.ts

          npm run test:e2e -- \
            --project=chromium-mobile \
            tests/E2E/f1-boss-uat.spec.ts

          unset F1_E2E_PASSWORD
          unset e2e_password

          echo "F1-A13 deterministic browser journeys: PASS"

      - name: Run deterministic F2 integrated browser journey
        run: |
          set -Eeuo pipefail

          server_pid=""

          cleanup() {
            status=$?

            unset F2_E2E_PASSWORD || true

            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" >/dev/null 2>&1 || true
            fi

            if [[ "$status" -ne 0 && -f /tmp/f2-integrated-e2e-server.log ]]; then
              echo "Laravel F2 E2E server log:"
              tail -n 160 /tmp/f2-integrated-e2e-server.log || true
            fi

            exit "$status"
          }

          trap cleanup EXIT

          test -f tests/E2E/f2-integrated-foundation.spec.ts
          test -f tests/E2E/support/prepare-f2-e2e.php

          f2_e2e_password="PbrF2_$(openssl rand -hex 32)"

          if [[ -z "$f2_e2e_password" ]]; then
            echo "Failed to generate disposable F2 E2E password." >&2
            exit 1
          fi

          echo "::add-mask::$f2_e2e_password"

          export F2_E2E_PASSWORD="$f2_e2e_password"

          php artisan migrate:fresh --force

          php tests/E2E/support/prepare-f2-e2e.php

          unset F2_E2E_PASSWORD

          php artisan serve \
            --host=127.0.0.1 \
            --port=8000 \
            >/tmp/f2-integrated-e2e-server.log 2>&1 &

          server_pid=$!

          ready=0

          for attempt in $(seq 1 30); do
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 2 \
              http://127.0.0.1:8000/login \
              >/dev/null
            then
              ready=1
              break
            fi

            sleep 1
          done

          if [[ "$ready" != "1" ]]; then
            echo "Laravel F2 E2E server did not become ready." >&2
            exit 1
          fi

          export F2_E2E_PASSWORD="$f2_e2e_password"

          npm run test:e2e -- \
            --project=chromium-desktop \
            tests/E2E/f2-integrated-foundation.spec.ts

          unset F2_E2E_PASSWORD
          unset f2_e2e_password

          echo "F2 integrated deterministic browser journey: PASS"

      - name: Run deterministic F4 formation and capital browser journey
        run: |
          set -Eeuo pipefail

          server_pid=""

          cleanup() {
            status=$?

            unset F4_E2E_PASSWORD || true

            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" >/dev/null 2>&1 || true
              wait "$server_pid" >/dev/null 2>&1 || true
            fi

            if [[ "$status" -ne 0 && -f /tmp/f4-e2e-server.log ]]; then
              echo "Laravel F4 E2E server log:"
              tail -n 160 /tmp/f4-e2e-server.log || true
            fi

            exit "$status"
          }

          trap cleanup EXIT

          test -f tests/E2E/f4-formation-capital.spec.ts
          test -f tests/E2E/support/prepare-f4-e2e.php

          f4_e2e_password="PbrF4_$(openssl rand -hex 32)"

          if [[ -z "$f4_e2e_password" ]]; then
            echo "Failed to generate disposable F4 E2E password." >&2
            exit 1
          fi

          echo "::add-mask::$f4_e2e_password"

          export F4_E2E_PASSWORD="$f4_e2e_password"

          php artisan migrate:fresh --force

          php tests/E2E/support/prepare-f4-e2e.php

          unset F4_E2E_PASSWORD

          php artisan serve             --host=127.0.0.1             --port=8000             >/tmp/f4-e2e-server.log 2>&1 &

          server_pid=$!

          ready=0

          for attempt in $(seq 1 30); do
            if curl               --fail               --silent               --show-error               --max-time 2               http://127.0.0.1:8000/login               >/dev/null
            then
              ready=1
              break
            fi

            sleep 1
          done

          if [[ "$ready" != "1" ]]; then
            echo "Laravel F4 E2E server did not become ready." >&2
            exit 1
          fi

          export F4_E2E_PASSWORD="$f4_e2e_password"

          npm run test:e2e --             --project=chromium-desktop             tests/E2E/f4-formation-capital.spec.ts

          unset F4_E2E_PASSWORD
          unset f4_e2e_password

          echo "F4 deterministic browser journey: PASS"

      - name: Stop disposable Redis E2E service
        if: always()
        run: |
          set -euo pipefail

          docker rm \
            --force \
            thepbr-os-v3-redis-ci-e2e \
            >/dev/null 2>&1 || true

          echo "Disposable Redis E2E cleanup: PASS"
